# Manual APK-only build (full CI including backend tests: see ci.yml)
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  mobile:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Install Dart/Flutter packages
        run: flutter pub get

      - name: Generate Android platform
        run: flutter create --platforms=android --org=com.ridex --project-name=ridex .

      - name: Patch RideX Android config
        working-directory: ${{ github.workspace }}
        env:
          RIDEX_SKIP_SIGNING: "1"
        run: python3 scripts/patch_mobile_native.py

      - name: Harden Android Gradle (Isar namespace + compileSdk 36)
        run: |
          set -e
          echo "Android gradle files:"
          find android -maxdepth 3 -name 'build.gradle*' -o -name 'settings.gradle*' | sort

          # Groovy root (Flutter <= ~3.27)
          if [ -f android/build.gradle ]; then
            cat >> android/build.gradle <<'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
            echo "Patched android/build.gradle"
          fi

          # Direct patch isar_flutter_libs if present in pub-cache (most reliable)
          ISAR_BG=$(find "$HOME/.pub-cache" -path "*isar_flutter_libs-*/android/build.gradle" 2>/dev/null | head -1 || true)
          if [ -n "$ISAR_BG" ]; then
            if ! grep -q "namespace " "$ISAR_BG"; then
              sed -i '/android {/a\    namespace "dev.isar.isar_flutter_libs"' "$ISAR_BG"
              echo "Injected namespace into $ISAR_BG"
            fi
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/' "$ISAR_BG" || true
          else
            echo "WARN: isar_flutter_libs build.gradle not found in pub-cache yet"
          fi

          for APP_GRADLE in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$APP_GRADLE" ]; then
              sed -i 's/minSdkVersion .*/minSdkVersion 24/' "$APP_GRADLE" || true
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$APP_GRADLE" || true
              sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/' "$APP_GRADLE" || true
              sed -i 's/compileSdk = [0-9]\+/compileSdk = 36/' "$APP_GRADLE" || true
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE" || true
            fi
          done


      - name: Re-apply Android patches after Gradle harden
        working-directory: ${{ github.workspace }}
        env:
          RIDEX_SKIP_SIGNING: "1"
        run: python3 scripts/patch_mobile_native.py

      - name: Codegen (Isar / Freezed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Launcher icons & splash (best-effort)
        continue-on-error: true
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build release APK (glass UI + HTTPS API)
        run: >
          flutter build apk --release --no-tree-shake-icons
          --dart-define=API_BASE_URL=https://130.210.24.87.sslip.io

      - name: Stage APK
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/output_apk
          APK="$(find mobile/build/app/outputs -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK found"
            find mobile/build -name '*.apk' -type f || true
            exit 1
          fi
          cp "$APK" /tmp/output_apk/RideX-v1.1-glass.apk
          ls -lh /tmp/output_apk/RideX-v1.1-glass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ridex-release-apk-v1-1-glass
          path: /tmp/output_apk/RideX-v1.1-glass.apk
          if-no-files-found: error
          retention-days: 14
