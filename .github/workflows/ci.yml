name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/ridex-api ./cmd/api

  mobile:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Dart/Flutter packages
        run: flutter pub get

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org=com.ridex --project-name=ridex .
          # Keep our sources; create only fills missing platform folders

      - name: Patch RideX Android config
        working-directory: ${{ github.workspace }}
        run: python3 scripts/patch_mobile_native.py

      - name: Harden Android Gradle (Isar / SDK)
        run: |
          if [ -f android/build.gradle ]; then
            cat >> android/build.gradle <<'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          if (namespace == null && project.group != null) {
                              namespace project.group
                          }
                          compileSdkVersion 35
                      }
                  }
              }
          }
          EOF
          fi

          for APP_GRADLE in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$APP_GRADLE" ]; then
              if grep -q "minSdkVersion" "$APP_GRADLE"; then
                sed -i 's/minSdkVersion .*/minSdkVersion 24/' "$APP_GRADLE"
              elif grep -q "minSdk " "$APP_GRADLE"; then
                sed -i 's/minSdk .*/minSdk 24/' "$APP_GRADLE"
              fi
              sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 35/' "$APP_GRADLE" || true
              sed -i 's/compileSdk = [0-9]\+/compileSdk = 35/' "$APP_GRADLE" || true
              sed -i 's/compileSdk [0-9]\+/compileSdk 35/' "$APP_GRADLE" || true
              # Flutter 3.x templates default minSdk via flutter.minSdkVersion; force 24
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$APP_GRADLE" || true
            fi
          done

      - name: Re-apply RideX signing + manifest patches
        working-directory: ${{ github.workspace }}
        run: python3 scripts/patch_mobile_native.py

      - name: Prove release signing config is wired
        run: |
          set -e
          test -f android/app/ridex-release.p12
          test -f android/app/key.properties
          if [ -f android/app/build.gradle.kts ]; then
            grep -q 'create("release")' android/app/build.gradle.kts
            grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts
            if grep -q 'getByName("debug")' android/app/build.gradle.kts; then
              echo "ERROR: release build still references debug signing"
              grep -n 'signingConfig' android/app/build.gradle.kts
              exit 1
            fi
          fi
          echo "Signing config OK"
          sed -n '1,120p' android/app/build.gradle.kts || sed -n '1,120p' android/app/build.gradle

      - name: Codegen (Isar / Freezed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Launcher icons & splash (best-effort)
        continue-on-error: true
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build signed release APK (HTTPS production API)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=API_BASE_URL=https://130.210.24.87.sslip.io 2>&1 | tee /tmp/flutter-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "======== flutter build failed; last 120 lines ========"
            tail -n 120 /tmp/flutter-build.log
            echo "======== build.gradle.kts ========"
            sed -n '1,120p' android/app/build.gradle.kts || true
            exit "$status"
          fi

      - name: Verify release signature (not debug)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          APK="$(find mobile/build/app/outputs -name '*.apk' -type f | head -n 1)"
          echo "APK=$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          fi
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
            if grep -qi "Android Debug" /tmp/apk-certs.txt; then
              echo "ERROR: APK still signed with Android debug key"
              exit 1
            fi
          fi
          echo "Signature verification done"

      - name: Stage APK
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/output_apk
          APK="$(find mobile/build/app/outputs -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK found under mobile/build/app/outputs"
            find mobile/build -name '*.apk' -type f || true
            exit 1
          fi
          cp "$APK" /tmp/output_apk/RideX-v1.1-glass.apk
          ls -lh /tmp/output_apk/RideX-v1.1-glass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ridex-release-apk-v1-1-glass
          path: /tmp/output_apk/RideX-v1.1-glass.apk
          if-no-files-found: error
          retention-days: 14
