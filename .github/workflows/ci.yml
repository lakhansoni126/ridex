name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/ridex-api ./cmd/api

  mobile:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # Isar 3.1.x needs an older Flutter/AGP combo than bleeding-edge stable.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Dart/Flutter packages
        run: flutter pub get

      - name: Generate Android platform
        run: flutter create --platforms=android --org=com.ridex --project-name=ridex .

      - name: Patch RideX Android config
        working-directory: ${{ github.workspace }}
        env:
          RIDEX_SKIP_SIGNING: "1"
        run: python3 scripts/patch_mobile_native.py

      - name: Harden Android Gradle (Isar namespace + compileSdk 36)
        run: |
          set -e
          PUB="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Android gradle files:"
          find android -maxdepth 3 \( -name 'build.gradle*' -o -name 'settings.gradle*' \) | sort
          echo "local.properties:"; cat android/local.properties || true
          echo "settings.gradle:"; cat android/settings.gradle 2>/dev/null || cat android/settings.gradle.kts 2>/dev/null || true

          # Replace flutter.*SdkVersion refs in every plugin android gradle file.
          # Avoids "Could not get unknown property 'flutter'" on :geolocator_android etc.
          # Do NOT use root afterEvaluate — conflicts with evaluationDependsOn(':app').
          while IFS= read -r -d '' f; do
            sed -i \
              -e 's/flutter\.compileSdkVersion/36/g' \
              -e 's/flutter\.targetSdkVersion/34/g' \
              -e 's/flutter\.minSdkVersion/24/g' \
              "$f"
          done < <(find "$PUB" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -path '*/android/*' -print0 2>/dev/null)

          ISAR_BG=$(find "$PUB" -path "*isar_flutter_libs-*/android/build.gradle" 2>/dev/null | head -1 || true)
          if [ -z "$ISAR_BG" ]; then
            echo "ERROR: isar_flutter_libs android/build.gradle not found under $PUB"
            exit 1
          fi
          echo "Patching Isar: $ISAR_BG"
          if ! grep -q 'namespace ' "$ISAR_BG"; then
            sed -i '/^android {/a\    namespace "dev.isar.isar_flutter_libs"' "$ISAR_BG"
          fi
          sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/' "$ISAR_BG" || true
          grep -n 'namespace\|compileSdk\|minSdk' "$ISAR_BG" | head -15

          for APP_GRADLE in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$APP_GRADLE" ]; then
              sed -i 's/flutter\.compileSdkVersion/36/g' "$APP_GRADLE" || true
              sed -i 's/flutter\.minSdkVersion/24/g' "$APP_GRADLE" || true
              sed -i 's/flutter\.targetSdkVersion/34/g' "$APP_GRADLE" || true
            fi
          done
          echo "Harden complete"


      - name: Codegen (Isar / Freezed)
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee /tmp/codegen.log
          test -f lib/features/ride/domain/ride_state.freezed.dart
          test -f lib/database/models.g.dart
          echo "Codegen outputs present"

      - name: Analyze Dart (surface compile errors)
        run: |
          flutter analyze lib 2>&1 | tee /tmp/analyze.log || true
          # Fail only on analyzer errors (ignore infos/warnings)
          if grep -E "^[[:space:]]*error -" /tmp/analyze.log; then
            echo "Analyzer reported errors"
            exit 1
          fi
          echo "No analyzer errors"

      - name: Unit & widget tests
        run: flutter test

      - name: Launcher icons & splash (best-effort)
        continue-on-error: true
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build release APK (iOS-style UI + HTTPS API)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=API_BASE_URL=https://130.210.24.87.sslip.io 2>&1 | tee /tmp/flutter-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "======== flutter build failed; last 200 lines ========"
            tail -n 200 /tmp/flutter-build.log
            echo "======== build.gradle.kts ========"
            sed -n '1,160p' android/app/build.gradle.kts || true
            echo "======== gradlew assembleRelease stacktrace ========"
            cd android
            ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-stack.log | tail -n 200 || true
            exit "$status"
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ridex-build-failure-logs
          path: |
            /tmp/flutter-build.log
            /tmp/analyze.log
            /tmp/codegen.log
            /tmp/gradle-stack.log
            mobile/android/app/build.gradle.kts
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage APK
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/output_apk
          APK="$(find mobile/build/app/outputs -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK found under mobile/build/app/outputs"
            find mobile/build -name '*.apk' -type f || true
            exit 1
          fi
          cp "$APK" /tmp/output_apk/RideX-v1.2.apk
          ls -lh /tmp/output_apk/RideX-v1.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ridex-release-apk-v1-2
          path: /tmp/output_apk/RideX-v1.2.apk
          if-no-files-found: error
          retention-days: 14
